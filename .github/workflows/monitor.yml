name: Daily flat check

on:
  schedule:
    # 06:00 and 16:00 Brussels time. GitHub schedules in UTC, so there is one timetable for
    # summer time (UTC+2) and one for winter time (UTC+1); the first step skips the one that
    # doesn't match today. GitHub can start scheduled runs a few minutes late.
    - cron: "0 4,14 * * *"
    - cron: "0 5,15 * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: monitor
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Only run at 06:00 and 16:00 Brussels time
        id: gate
        env:
          SCHEDULE: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Brussels date +%z)   # +0200 in summer time, +0100 in winter time
          run=yes
          if [ "$SCHEDULE" = "0 4,14 * * *" ] && [ "$offset" != "+0200" ]; then run=no; fi
          if [ "$SCHEDULE" = "0 5,15 * * *" ] && [ "$offset" != "+0100" ]; then run=no; fi
          echo "Brussels offset $offset, schedule '${SCHEDULE:-manual}', run=$run"
          echo "run=$run" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'yes'

      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'yes'
        with:
          node-version: 20

      - name: Look for new flats (Immoweb, Immovlan, agency websites)
        if: steps.gate.outputs.run == 'yes'
        run: node monitor/discover.mjs --report "$RUNNER_TEMP/new.md"

      - name: Check the flats with a Yes vote
        if: steps.gate.outputs.run == 'yes'
        run: node monitor/check.mjs --report "$RUNNER_TEMP/changes.md"

      - name: Save the results
        if: steps.gate.outputs.run == 'yes'
        run: |
          git add data/flats.json data/status.json monitor/state.json monitor/seen.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "Daily flat check $(date -u +%Y-%m-%d)"
            git push
          fi

      - name: Open an issue when there is news
        if: steps.gate.outputs.run == 'yes'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="$RUNNER_TEMP/issue.md"
          : > "$body"
          [ -s "$RUNNER_TEMP/new.md" ] && { cat "$RUNNER_TEMP/new.md"; echo; } >> "$body"
          [ -s "$RUNNER_TEMP/changes.md" ] && cat "$RUNNER_TEMP/changes.md" >> "$body"
          if [ -s "$body" ]; then
            gh issue create --title "Flat news $(date -u +%Y-%m-%d)" --body-file "$body"
          fi
